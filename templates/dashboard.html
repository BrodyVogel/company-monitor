{% extends "base.html" %}

{% block title %}Morning Dashboard - Coverage Monitor{% endblock %}

{% block content %}
<div id="dashboard">
    <!-- Header -->
    <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-bold text-gray-900">Morning Dashboard</h1>
        <button id="import-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium">
            Import
        </button>
        <input type="file" id="file-input" accept=".json" class="hidden">
    </div>

    <!-- Alert banners -->
    <div id="alert-banners"></div>

    <!-- Company table -->
    <div id="company-table-container"></div>

    <!-- Empty state -->
    <div id="empty-state" class="hidden text-center py-16">
        <p class="text-gray-500 text-lg mb-4">No companies onboarded yet. Import an onboard JSON to get started.</p>
        <button id="empty-import-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium">
            Import
        </button>
    </div>
</div>

<!-- Toast container -->
<div id="toast-container" class="fixed top-4 right-4 z-50 space-y-2"></div>
{% endblock %}

{% block scripts %}
<script src="/static/dashboard.js"></script>
{% endblock %}
